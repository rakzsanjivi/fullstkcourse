<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marginpadding</title>
<style>
    h2{
        display: inline-block;
        margin:10px,5px;
        padding: 10px,5px;
        border:2px solid black;
        background-color: aquamarine;
    }
    h1{
        display: inline-block;
        margin:10px,15px,16px,20px;
        padding: 10px,15px,16px,20px;
        border:2px solid black;
        background-color: aquamarine;
    }
     h5{
        display: inline-block;
        padding-bottom: 10px;
        padding-top: 12px;
        padding-right: 14px;
        padding-left: 16px;
        margin-bottom: 10px;
        margin-top: 12px;
        margin-right: 14px;
        margin-left: 16px;
        border:2px solid black;
        background-color: aquamarine;
    }
</style>
</head>
<body>
    <h2>item1</h2>
    <h1>item2</h1>
    <h5>item3</h5>
</body>
</html>
