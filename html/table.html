<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Tables</title>
<style>
    table,thead,tbody,th,td{
        border: 1px solid black;
        padding: 15px;
        border-collapse: collapse;
    }
</style>
</head>

            </tr>
            <tr>
                <td>faizal</td>

            </tr>
             <tr>

    </table>

</html>
